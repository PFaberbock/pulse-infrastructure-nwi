<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Pulse Infrastructure NWI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#050B1E;
    color:#fff;
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  .check{
    width:72px;height:72px;
    border-radius:50%;
    background:rgba(47,224,138,0.15);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 28px;
  }
  .check svg{width:36px;height:36px;stroke:#2FE08A;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  h1{
    font-family:'Big Shoulders Display',sans-serif;
    font-size:clamp(2rem,5vw,3.2rem);
    text-transform:uppercase;
    letter-spacing:-0.01em;
    margin-bottom:16px;
  }
  p{color:#8E9DC4;font-size:1.05rem;max-width:480px;line-height:1.6;}
  .back{
    margin-top:36px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#1A73FF;
    text-decoration:none;
  }
  .back:hover{color:#3D8BFF;}
</style>
</head>
<body>
  <div class="check">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Request Received</h1>
  <p>Thanks for reaching out. We'll review your project details and be in touch within one business day.</p>
  <a class="back" href="/">← Back to Pulse Infrastructure NWI</a>
</body>
</html>
